name: Build & Release (Folia 26.2)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onewayelytra-folia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Folia 26.2 JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read project version
        id: version
        run: echo "version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Verify Folia 26.2 metadata
        run: |
          JAR="target/OneWayElytra-${{ steps.version.outputs.version }}.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | tee /tmp/plugin.yml
          grep -q "api-version: '26.2'" /tmp/plugin.yml
          grep -q "folia-supported: true" /tmp/plugin.yml

      - name: Prepare release JAR
        run: |
          mkdir -p release
          cp "target/OneWayElytra-${{ steps.version.outputs.version }}.jar" \
             "release/OneWayElytra-${{ steps.version.outputs.version }}-folia-26.2.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneWayElytra-Folia-26.2
          path: release/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: OneWayElytra-Folia-26.2
          path: release

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: OneWayElytra v${{ needs.build.outputs.version }} (Folia 26.2)
          body_path: CHANGELOG.md
          files: release/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
